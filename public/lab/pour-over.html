}

  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Cream card and page. */
.iso[data-theme="light"]{--anatomy-page:#e6d8be;--anatomy-card:#f6eedc;--anatomy-paper:#f6eedc;--anatomy-text:#5d4b3a;--anatomy-strong:#2b1c11;--anatomy-muted:#8f7b66;--anatomy-halo:#6b4a2c;--anatomy-halo-opacity:.3}
.iso-page{margin-top:28px}

/* Tabs: one page per coffee maker. */
.em-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.em-tabs a{color:var(--anatomy-text);text-decoration:none;padding:8px 11px;box-shadow:0 0 0 1px var(--anatomy-muted);background:var(--anatomy-card)}
.em-tabs a:hover{color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-strong)}
.em-tabs a[aria-current="page"]{color:var(--anatomy-card);background:#6f3d20;box-shadow:0 0 0 1px #6f3d20}

/* Materials: each part takes its fills and line tones from one base colour (--m) and its dark (--k). */
.it[data-mat="steel"]{--m:#cfd4d8;--k:#1c2530}
.it[data-mat="brown"]{--m:#8b5a3c;--k:#1d0d04}
.it[data-mat="cream"]{--m:#f0e2c2;--k:#3d2b14}
.it[data-mat="white"]{--m:#fcfbf7;--k:#3c3a35}
.it[data-mat="black"]{--m:#4a4541;--k:#0c0a09}
.it[data-mat="cork"]{--m:#c9a06c;--k:#3a2208}
.it[data-mat="copper"]{--m:#c98a5e;--k:#3a1606}
.it[data-mat="green"]{--m:#5d7a63;--k:#0e1a11}
.it[data-mat="glass"]{--m:#e3ecec;--k:#24363b}
.it[data-mat="coffee"]{--m:#6f3d20;--k:#1d0d04}
.it[data-mat]{
  --anatomy-paper:var(--m);--anatomy-face:var(--m);
  --anatomy-shade-3:var(--m);
  --anatomy-shade-2:color-mix(in srgb,var(--m) 94%,var(--k));
  --anatomy-shade-1:color-mix(in srgb,var(--m) 87%,var(--k));
  --anatomy-shade-0:color-mix(in srgb,var(--m) 79%,var(--k));
  --anatomy-top:color-mix(in srgb,var(--m) 76%,#fff);
  --anatomy-lit-top:var(--anatomy-top);--anatomy-lit-shade:var(--anatomy-shade-2);
  --anatomy-hi:color-mix(in srgb,var(--m) 28%,var(--k));
  --anatomy-mid:color-mix(in srgb,var(--m) 50%,var(--k));
  --anatomy-lo:color-mix(in srgb,var(--m) 66%,var(--k));
  --anatomy-faint:color-mix(in srgb,var(--m) 82%,var(--k));
}
/* Glass is see-through; a shell marked data-ghost fades to see-through when clicked. */
.it[data-mat="glass"] .iso-fill,.it[data-mat="glass"] .iso-shade,.it[data-mat="glass"] .iso-top{opacity:.2}
.it[data-ghost]{cursor:pointer}
.it[data-ghost] .iso-fill,.it[data-ghost] .iso-shade,.it[data-ghost] .iso-top{opacity:var(--ghost,1)}
.it[data-ghost]:hover .iso-edge{stroke:var(--anatomy-lit)}

.em{--em-coffee:#5a2f17;--em-crema:#b9793d;--em-water:#b7d0e2}
.em-stage{outline:none;touch-action:pan-y}
.em-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.em-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* Liquids drawn by the page: --brew runs from 0 (water) to 100 (coffee). */
.lq-body{fill:color-mix(in srgb,var(--em-coffee) calc(var(--brew,100)*1%),var(--em-water));stroke:none;opacity:var(--lq,.95)}
.lq-top{fill:color-mix(in srgb,color-mix(in srgb,var(--em-crema) calc(var(--brew,100)*1%),#dcebf5) 70%,#fff);stroke:color-mix(in srgb,var(--em-coffee) 50%,transparent);stroke-width:.5;opacity:var(--lq,.9)}
.em-stream{fill:none;stroke:var(--em-crema);stroke-linecap:round;stroke-width:1.2}
.em-stream[data-kind="water"]{stroke:#8fb6d3}
.em-steam{fill:none;stroke:#fff;stroke-linecap:round;stroke-width:1.4;opacity:.7}

/* Solid tints for water and heat, mixed into the part's own shades. */
.em-water>.iso-shade[data-shade="0"]{fill:color-mix(in srgb,var(--anatomy-blue) 16%,var(--anatomy-shade-0))}
.em-water>.iso-shade[data-shade="1"]{fill:color-mix(in srgb,var(--anatomy-blue) 16%,var(--anatomy-shade-1))}
.em-water>.iso-shade[data-shade="2"]{fill:color-mix(in srgb,var(--anatomy-blue) 16%,var(--anatomy-shade-2))}
.em-water>.iso-shade[data-shade="3"]{fill:color-mix(in srgb,var(--anatomy-blue) 16%,var(--anatomy-shade-3))}
.em-water>.iso-top{fill:color-mix(in srgb,var(--anatomy-blue) 16%,var(--anatomy-top))}
.em-heat>.iso-shade,.em-heat>.iso-top{transition:fill 400ms linear}
.it[data-hot] .em-heat>.iso-shade[data-shade="0"]{fill:color-mix(in srgb,var(--anatomy-red) 26%,var(--anatomy-shade-0))}
.it[data-hot] .em-heat>.iso-shade[data-shade="1"]{fill:color-mix(in srgb,var(--anatomy-red) 26%,var(--anatomy-shade-1))}
.it[data-hot] .em-heat>.iso-shade[data-shade="2"]{fill:color-mix(in srgb,var(--anatomy-red) 26%,var(--anatomy-shade-2))}
.it[data-hot] .em-heat>.iso-shade[data-shade="3"]{fill:color-mix(in srgb,var(--anatomy-red) 26%,var(--anatomy-shade-3))}
.it[data-hot] .em-heat>.iso-top{fill:color-mix(in srgb,var(--anatomy-red) 26%,var(--anatomy-top))}

/* Pipes take a tint while liquid is moving in them. */
.em .tb-body,.em .tb-shine,.em .tb-shade{transition:fill 260ms linear}
.it[data-wet="cold"] .tb-body{fill:color-mix(in srgb,var(--anatomy-blue) 46%,var(--anatomy-shade-2))}
.it[data-wet="cold"] .tb-shine{fill:color-mix(in srgb,var(--anatomy-blue) 28%,var(--anatomy-top))}
.it[data-wet="cold"] .tb-shade{fill:color-mix(in srgb,var(--anatomy-blue) 50%,var(--anatomy-shade-0))}
.it[data-wet="hot"] .tb-body{fill:color-mix(in srgb,var(--anatomy-red) 46%,var(--anatomy-shade-2))}
.it[data-wet="hot"] .tb-shine{fill:color-mix(in srgb,var(--anatomy-red) 28%,var(--anatomy-top))}
.it[data-wet="hot"] .tb-shade{fill:color-mix(in srgb,var(--anatomy-red) 50%,var(--anatomy-shade-0))}
.it[data-wet="coffee"] .tb-body{fill:color-mix(in srgb,var(--em-coffee) 60%,var(--anatomy-shade-2))}
.it[data-wet="coffee"] .tb-shine{fill:color-mix(in srgb,var(--em-crema) 50%,var(--anatomy-top))}
.it[data-wet="coffee"] .tb-shade{fill:color-mix(in srgb,var(--em-coffee) 70%,var(--anatomy-shade-0))}

/* Names beside the exploded view. */
.lb{pointer-events:none;opacity:0}
.lb-line{fill:none;stroke:var(--anatomy-muted);stroke-width:.7;vector-effect:non-scaling-stroke}
.lb-dot{fill:var(--anatomy-strong)}
.lb-title{fill:var(--anatomy-strong);font-family:var(--anatomy-mono);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lb-note{fill:var(--anatomy-muted);font-family:var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase}

.em-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 10px;margin-top:14px;font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.em-controls button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--anatomy-text);background:var(--anatomy-card);border:0;box-shadow:0 0 0 1px var(--anatomy-muted);padding:7px 11px;cursor:pointer}
.em-controls button:hover{color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-strong)}
.em-controls button:disabled{opacity:.4;cursor:default}
.em-controls button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.em-controls .em-go{color:var(--anatomy-card);background:#6f3d20;box-shadow:0 0 0 1px #6f3d20}
.em-controls .em-go:hover{color:#fff}
.em-check{display:inline-flex;align-items:center;gap:7px;color:var(--anatomy-text);cursor:pointer;padding:6px 4px}
.em-check input{accent-color:#6f3d20;width:14px;height:14px;margin:0}
.em-grind{display:flex;align-items:center;gap:1px;margin-left:8px}
.em-grind-name{color:var(--anatomy-muted);margin-right:9px}
.em-grind button[aria-checked="true"]{color:var(--anatomy-card);background:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-strong)}

trols"><button type="button" class="em-go" data-apart>Take apart</button><button type="button" data-action>Brew</button><label class="em-check"><input type="checkbox" data-labels> Labels</label></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Thin stream from the spout, poured in stages</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Coffee drips through the mesh into the glass</span></span><span class="iso-caption">A pour-over has no motor and no pump: only gravity. 30 g of medium-ground coffee sits in a fine steel cone, and 500 g of water at about 94 °C is poured on it from a gooseneck kettle in a thin, slow stream. The first 60 g wets the grounds, which swell and give off gas for about 35 seconds (the bloom). The rest goes in three pours. The water level in the cone rises with each pour and sinks as the water seeps down through the coffee bed and the mesh, and the coffee drips from the tip of the cone into the glass carafe below, finishing at about 3:30. The brew is played 15 times faster than life.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);

      // The kettle's thin stream, from the spout tip to wherever the water stands.
      stream.innerHTML = show.flow > 0.02 ? `<path class="em-stream" data-kind="water" style="opacity:${show.flow.toFixed(2)};stroke-width:1.1" d="${RT.line([0, 0, X.spoutZ], [0, 0, surface + 0.3])}"/>` : "";
      // Coffee in the carafe, and the drip from the cone's tip.
      const level = bulbH(Math.max(0, m.wout));
      const bulbTop = X.z0 + level;
      coffee.style.setProperty("--brew", (100 - 14 * Math.min(1, m.wout / 450)).toFixed(1));
      RT.liquid(coffee, 0, 0, X.z0 + X.floor, bulbTop, (z) => rinAt(z - X.z0), 14);
      const dripping = running() && m.rate > 0.05;
      drip.innerHTML = dripping ? `<path class="em-stream" style="stroke-width:1;stroke-dasharray:1.6 2.6;stroke-dashoffset:${(-show.clock * 16).toFixed(1)}" d="${RT.line([0, 0, X.tip - 0.2], [0, 0, Math.max(bulbTop, X.z0 + X.floor) + 0.3])}"/>` : "";
    },
    text() {
      if (m.phase === "ready") return "ready · 30 g coffee · 500 g water";
      if (m.phase === "lift") return "kettle up · 94 °C";
      if (m.phase === "done") return `done · ${clockOf(m.t)} · ${Math.round(m.wout)} g of coffee`;
      if (m.t >= 150) return `draining · ${clockOf(m.t)} · ${Math.round(m.wout)} g in the carafe`;
      return `${stageOf(m.t)} · ${clockOf(m.t)} · ${Math.round(m.win)} g · ${tempOf()} °C`;
    },
  };
  RT.boot();
}
</script></body></html>
